plugins {
    id 'com.android.application'
}

android {
    compileSdk 34 // necesar de CameraX 1.3.4 (camera-core/camera2/lifecycle/view); targetSdk ramane 31

    defaultConfig {
        applicationId "com.wwp.QA"
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // This will write out the Room database schema to a schemas subfolder of your project folder
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.wwp.QA'


}

// CameraX (camera-lifecycle/camera-view) aduce tranzitiv androidx.lifecycle 2.5.1, care aduce
// kotlinx-coroutines-android:1.6.1, care la randul lui cere kotlin-stdlib-jdk7/jdk8:1.6.0 - versiuni
// vechi care inca includ propriile clase (nu doar redirectioneaza spre kotlin-stdlib, cum fac
// versiunile 1.8.x). kotlin-stdlib insusi e rezolvat la 1.8.22 (cerut de alte librarii), deci
// clasele din kotlin-stdlib-jdk7/jdk8:1.6.0 ajung duplicate fata de cele deja incluse in
// kotlin-stdlib:1.8.22 -> "Duplicate class ... found in modules kotlin-stdlib-1.8.22.jar and
// kotlin-stdlib-jdk7/jdk8-1.6.0.jar". Fortam aceeasi versiune peste tot.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Migration frmo AppCompat to AndroidX
    // ======================================================================================
    // With Android Studio 3.2 and higher, you can migrate an existing project to AndroidX by
    // selecting Refactor > Migrate to AndroidX from the menu bar
    // Here you can write your class dependency of AppCompat than the Refactor will translate
    // them automatically into AndroidX libraries

    //support design
    implementation "com.google.android.material:material:1.0.0"

    //card view
    implementation "androidx.cardview:cardview:1.0.0"

    //recyclerview
    implementation "androidx.recyclerview:recyclerview:1.0.0"

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.3.1@aar'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.0.0'


    //room
    implementation "androidx.room:room-runtime:2.4.1"
    annotationProcessor "androidx.room:room-compiler:2.4.1"
    testImplementation "androidx.room:room-testing:2.4.1"

    //retrofit
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.retrofit2:retrofit:2.8.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.8.1'
    implementation 'com.squareup.retrofit2:converter-scalars:2.3.0'

    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.squareup.okio:okio:2.2.2'
    implementation 'com.squareup.okhttp3:okhttp:3.14.7'

    // ML Kit + CameraX (inlocuiesc modulul qrcodescanner/ZXing, la fel ca in pms_3u354 si mm)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.zxing:core:3.3.2'

}